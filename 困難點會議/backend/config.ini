[Paths]
# CSV 資料檔案路徑
meeting_csv = static\MeetingRecording.csv

# JSON 相關路徑
employee_info = static\emoinfo.json
permissions = static\proposals.json

# 進度記錄目錄
progress_dir = static\progress_records

# 使用者篩選狀態目錄
filter_dir = static\user_filters

# 會議圖片目錄
meeting_images = static\meeting_images

# 留言相關目錄
comments_dir = static\meeting_comments         
comments_images_dir = static\meeting_comments\images  

# 提案人已讀紀錄（新增）
proposer_read_records = static\proposer_read_records.json


# Log 檔案路徑
log_file = static\app.log

# 留言板相關目錄
bulletin_data_file = static\bulletin_board\messages.json
bulletin_images_dir = static\bulletin_board\images


[App]
# 上傳檔案大小限制 (bytes)
# 100MB = 100 * 1024 * 1024 = 104857600
max_content_length = 104857600

[LDAP]
# LDAP 伺服器設定
server = ldap://KHADDC02.kh.asegroup.com
domain = kh

[BulletinBoard]
# 允許的圖片格式（逗號分隔）
allowed_extensions = png,jpg,jpeg,gif,webp

# 最大檔案大小（MB）
max_file_size_mb = 5